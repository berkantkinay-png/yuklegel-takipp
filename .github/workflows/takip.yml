name: YukleGel Takip

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  takip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Ilanlari kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARANAN: ${{ vars.ARANAN }}
          HARIC: ${{ vars.HARIC }}
        run: python yuklegel_takip.py --bir-kez
      - name: Durumu kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gorulen_ilanlar.json || true
          git diff --cached --quiet || (git commit -m "durum [skip ci]" && git push)
